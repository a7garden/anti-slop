name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Package, installer, and evaluator unit tests
        run: npm test
      - name: Node installer smoke test
        run: |
          node bin/install.mjs --dir "$RUNNER_TEMP/skill-target"
          test -f "$RUNNER_TEMP/skill-target/anti-slop/SKILL.md"
